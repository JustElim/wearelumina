<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeAreLumina - Streetwear</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- GRUNDEINSTELLUNGEN --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            /* Der Hintergrund der gesamten Seite unter dem Hero ist das dunkle Grau */
            background-color: #333333;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* --- NAVIGATION --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
            background-color: #eef2f6; /* Das helle Grau-Blau aus dem Screenshot */
            color: #111;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        .nav-links a {
            text-decoration: none;
            color: #444;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #000;
        }

        .icons {
            font-size: 1.2rem;
            display: flex;
            gap: 1.2rem;
            cursor: pointer;
            color: #111;
        }

        /* --- HERO BEREICH --- */
        .hero {
            height: 60vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Ein dunkler, stimmungsvoller Farbverlauf als Platzhalter für das Hintergrundbild */
            background: linear-gradient(to bottom, rgba(30,35,30,0.8), rgba(20,20,20,0.9)), url('https://images.unsplash.com/photo-1504198458649-3128b932f49e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover;
            text-align: center;
            position: relative;
        }

        .hero h1 {
            font-size: 4.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            letter-spacing: -1px;
            color: #ffffff;
        }

        .hero-btn {
            padding: 0.8rem 2.5rem;
            background: transparent;
            color: #ffffff;
            text-decoration: none;
            border: 1px solid #ffffff;
            border-radius: 30px; /* Abgerundete Ecken wie im Screenshot */
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .hero-btn:hover {
            background-color: #ffffff;
            color: #000000;
        }

        /* --- PRODUKTE BEREICH --- */
        .products-section {
            padding: 4rem 3rem;
            background-color: #333333;
        }

        .products-section h2 {
            font-size: 2rem;
            margin-bottom: 4rem;
            font-weight: 700;
            color: #ffffff;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

        /* Das "Ausverkauft" Badge */
        .badge {
            background-color: #f4f4f4;
            color: #333;
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            position: absolute;
            top: -15px; /* Lässt das Badge leicht über dem Shirt schweben */
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Platzhalter für die T-Shirts (da wir die echten Grafiken noch nicht haben) */
        .shirt-placeholder {
            width: 100%;
            height: 300px;
            /* Ein noch dunkleres Grau, um die Form eines T-Shirts anzudeuten */
            background-color: #222222; 
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 0.9rem;
            transition: transform 0.3s ease;
        }

        .product-card:hover .shirt-placeholder {
            transform: scale(1.02);
        }

        /* Responsive Design für kleinere Bildschirme */
        @media (max-width: 1024px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 3rem 2rem; }
            .hero h1 { font-size: 3rem; }
        }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 1rem; padding: 1rem; }
            .nav-links { gap: 1rem; }
            .product-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <div class="logo">WeAreLumina</div>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Katalog</a></li>
                <li><a href="#">Kontakt</a></li>
                <li><a href="#">über uns</a></li>
            </ul>
        </div>
        <div class="icons">
            <span>🔍</span> 
            <span>👤</span> 
            <span>🛍️</span>
        </div>
    </nav>

    <header class="hero">
        <h1>WeAreLumina©</h1>
        <a href="#" class="hero-btn">Shop all</a>
    </header>

    <section class="products-section">
        <h2>Produkte</h2>
        <div class="product-grid">
            
            <div class="product-card">
                <div class="badge">Ausverkauft</div>
                <div class="shirt-placeholder">BORN AGAIN (Platzhalter)</div>
            </div>

            <div class="product-card">
                <div class="badge">Ausverkauft</div>
                <div class="shirt-placeholder">DEAD TO THE WORLD (Platzhalter)</div>
            </div>

            <div class="product-card">
                <div class="badge">Ausverkauft</div>
                <div class="shirt-placeholder">MADE BY CHRIST (Platzhalter)</div>
            </div>

            <div class="product-card">
                <div class="badge">Ausverkauft</div>
                <div class="shirt-placeholder">BURNED CROSS (Platzhalter)</div>
            </div>

        </div>
    </section>

</body>
</html>
