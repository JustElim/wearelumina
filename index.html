<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEARELUMINA - Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* --- Grundlegendes Setup --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: #000000; /* Reines Schwarz */
            color: #ffffff; /* Reines Weiß */
            overflow-x: hidden; 
        }

        /* --- Dynamischer 1-zu-1 Seifenblasen-Hintergrund --- */
        #bubble-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0; /* GEFIXT: Nicht mehr -1, sonst verschluckt das Schwarz die Blasen */
            overflow: hidden;
            pointer-events: none; 
        }

        .bubble {
            position: absolute;
            /* GEFIXT: Sucht jetzt nach deinem originalen Dateinamen */
            background-image: url('-24.jpg'); 
            background-repeat: no-repeat;
            
            /* Der Magic-Trick: Blendet das Schwarz des Bildes komplett aus! */
            mix-blend-mode: screen; 
            
            /* Erzeugt einen weichen, runden Rand, damit man keine eckigen Kanten sieht */
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 70%);
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 70%);
        }

        /* Sehr langsame, sanfte Schwebe-Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }

        /* --- Navbar (S/W Glassmorphism) --- */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.2rem 3rem; 
            background-color: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: fixed; width: 100%; top: 0; 
            z-index: 1000;
        }
        .nav-left { display: flex; align-items: center; gap: 3rem; }
        
        .anime-logo { 
            transform: skewX(-12deg); 
            font-family: 'Arial Black', sans-serif; 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
        }
        .anime-logo .ti { 
            font-size: 1.1rem; 
            font-weight: 900; 
            letter-spacing: 1px; 
            margin-bottom: 2px;
            color: #ffffff; 
        }
        .anime-logo .en { 
            font-size: 0.9rem; 
            letter-spacing: 4px; 
            color: #ffffff; 
        }

        .nav-links { display: flex; list-style: none; gap: 2rem; }
        .nav-links a { text-decoration: none; color: #aeb2d8; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; }
        .nav-links a:hover, .nav-links a.active { color: #ffffff; }
        
        .icons { font-size: 1.2rem; display: flex; gap: 1.5rem; color: #ffffff; cursor: pointer; }
        .icons span:hover { opacity: 0.7; }

        /* --- Views --- */
        .view-section { 
            display: none; 
            padding-top: 100px; 
            padding-bottom: 4rem; 
            position: relative; /* GEFIXT: Garantiert, dass der Inhalt über den Blasen liegt */
            z-index: 10; 
        }
        .view-section.active { display: block; animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Ansicht 1: Neuheiten --- */
        .hero { height: 50vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .hero h1 { font-size: 4rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: -2px; }
        .hero p { font-size: 1.2rem; color: #aeb2d8; margin-bottom: 2.5rem; text-transform: uppercase; letter-spacing: 4px; }
        .hero-btn { 
            padding: 1rem 3rem; 
            background: transparent; 
            color: #ffffff; 
            text-decoration: none; 
            border-radius: 40px; 
            font-weight: 700;
            border: 1px solid #ffffff;
            transition: all 0.3s ease;
        }
        .hero-btn:hover { background: #ffffff; color: #000000; }
        
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3rem; max-width: 1000px; margin: 2rem auto 2rem auto; padding: 0 2rem; }
        .product-card { 
            display: flex; flex-direction: column; align-items: center; 
            background-color: rgba(15, 15, 15, 0.6); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 2rem; border-radius: 20px; position: relative; 
        }
        .product-id { position: absolute; top: 1rem; left: 1.5rem; font-size: 1.2rem; font-weight: bold; color: #ffffff; opacity: 0.3; }
        .badge { background-color: #ffffff; color: #000000; padding: 0.4rem 1.2rem; border-radius: 20px; font-size: 0.75rem; font-weight: 800; margin-bottom: 1rem; align-self: flex-end; }
        .product-image { width: 100%; height: 350px; background-size: contain; background-position: center; background-repeat: no-repeat; }

        /* --- Ansicht 2: Kollektionen --- */
        .collections-header { text-align: center; margin-bottom: 2rem; }
        .collections-header h2 { font-size: 3rem; font-weight: 800; letter-spacing: -1px; }

        .slider-container { display: flex; align-items: center; justify-content: center; gap: 2rem; max-width: 900px; margin: 0 auto; padding: 0 2rem; }
        .slider-btn { background: rgba(15, 15, 15, 0.6); backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2); color: #ffffff; border-radius: 50%; width: 50px; height: 50px; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
        .slider-btn:hover { background: #ffffff; color: #000000; }
        
        .slider-card { 
            flex-grow: 1; max-width: 500px; 
            background-color: rgba(15, 15, 15, 0.6); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05); 
            padding: 3rem; border-radius: 20px; position: relative; text-align: center; 
        }
        .slider-card .product-image { height: 400px; background-size: contain; background-position: center; background-repeat: no-repeat; }

        /* --- Ansicht 3: Unsere Story & Vision --- */
        .story-wrapper { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 4rem; }
        
        .story-section { 
            max-width: 800px; 
            text-align: center; 
            padding: 3rem; 
            background-color: rgba(15, 15, 15, 0.6); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .story-section h2 { font-size: 3.5rem; font-weight: 800; margin-bottom: 2rem; display: inline-block; border-bottom: 4px solid #ffffff; padding-bottom: 0.5rem; transform: skewX(-10deg); }
        .story-section p { font-size: 1.1rem; line-height: 1.8; color: #cccccc; margin-bottom: 1.5rem; text-align: justify; }

        /* Scrapbook Bild-Styling */
        .story-image-container { position: relative; display: inline-block; margin-top: 4rem; margin-bottom: 1rem; }
        .story-image { max-width: 100%; height: auto; border: 10px solid #ffffff; box-shadow: 0 15px 30px rgba(0,0,0,0.8); transform: rotate(2deg); display: block; filter: grayscale(100%); }

        .tape { position: absolute; background-color: #111; width: 80px; height: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); z-index: 10; }
        .tape-top-left { top: -15px; left: -25px; transform: rotate(-45deg); }
        .tape-bottom-right { bottom: -15px; right: -25px; transform: rotate(-45deg); }

        /* --- Responsive Design --- */
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .product-grid { grid-template-columns: 1fr; } 
            .hero h1 { font-size: 3rem; }
            .slider-container { flex-direction: column; }
            .slider-btn { transform: rotate(90deg); margin: 1rem 0; }
            .story-section { padding: 1.5rem; margin: 0 1rem; }
            .story-section h2 { font-size: 2.5rem; }
            .story-image { border-width: 8px; }
            .tape { width: 50px; height: 15px; }
        }
    </style>
</head>
