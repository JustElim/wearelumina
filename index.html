<nav class="hidden md:flex items-center gap-10 text-xs font-medium tracking-[0.15em] text-zinc-400 uppercase">
  <a href="#home" class="hover:text-white transition-colors duration-250">Home</a>
  <a href="#drop" class="text-celestial font-bold hover:text-white transition-colors duration-250 animate-pulse">Coming Soon</a>
  <a href="#products" class="hover:text-white transition-colors duration-250">Archive</a>
  <a href="#vision" class="hover:text-white transition-colors duration-250">Vision</a>
</nav>

<section id="drop" class="relative min-h-screen flex flex-col justify-center items-center px-6 bg-midnight overflow-hidden border-y border-white/5">
    
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[40rem] h-[40rem] bg-celestial/5 rounded-full blur-[150px] pointer-events-none"></div>

    <div class="max-w-4xl w-full text-center space-y-12 z-10">
        
        <div class="space-y-4">
            <span class="text-[10px] font-bold tracking-[0.5em] text-celestial uppercase py-1 px-4 border border-celestial/20 rounded-full inline-block">
                Next Transmission
            </span>
            <h2 class="text-4xl md:text-6xl font-serif font-black tracking-[0.2em] text-white uppercase text-celestial-shadow">
                BORN AGAIN®
            </h2>
        </div>

        <div class="relative group cursor-wait">
            <div class="absolute inset-0 bg-celestial/20 rounded-full blur-[80px] scale-75 group-hover:scale-100 transition-transform duration-1000 opacity-50"></div>
            
            <div class="relative filter blur-[45px] grayscale opacity-40 scale-90 transition-all duration-1000 group-hover:blur-[35px] group-hover:opacity-60">
                <img src="https://i.ibb.co/vY8mY8D/born-again-shirt-placeholder.png" alt="Classified Drop" class="mx-auto w-80 h-auto">
            </div>

            <div class="absolute inset-0 flex items-center justify-center">
                <span class="text-[10px] md:text-xs font-serif italic tracking-[1em] text-white/40 uppercase rotate-[-10deg] select-none">
                    Ethereal Archive 01
                </span>
            </div>
        </div>

        <div class="grid grid-cols-4 gap-4 max-w-md mx-auto pt-8">
            <div class="space-y-2">
                <div id="days" class="text-2xl md:text-4xl font-sans font-light tracking-tighter text-white bg-white/5 rounded-lg py-4 border border-white/10">00</div>
                <span class="text-[8px] tracking-widest text-zinc-500 uppercase">Days</span>
            </div>
            <div class="space-y-2">
                <div id="hours" class="text-2xl md:text-4xl font-sans font-light tracking-tighter text-white bg-white/5 rounded-lg py-4 border border-white/10">00</div>
                <span class="text-[8px] tracking-widest text-zinc-500 uppercase">Hours</span>
            </div>
            <div class="space-y-2">
                <div id="minutes" class="text-2xl md:text-4xl font-sans font-light tracking-tighter text-white bg-white/5 rounded-lg py-4 border border-white/10">00</div>
                <span class="text-[8px] tracking-widest text-zinc-500 uppercase">Mins</span>
            </div>
            <div class="space-y-2">
                <div id="seconds" class="text-2xl md:text-4xl font-sans font-light tracking-tighter text-celestial bg-celestial/5 rounded-lg py-4 border border-celestial/20 animate-pulse">00</div>
                <span class="text-[8px] tracking-widest text-zinc-500 uppercase">Secs</span>
            </div>
        </div>

        <p class="text-[10px] md:text-xs text-zinc-500 tracking-[0.3em] uppercase max-w-sm mx-auto leading-relaxed">
            Zugang wird am 07. Juni um 12:00 Uhr freigeschaltet. <br>
            Sei bereit für die Wiedergeburt.
        </p>
    </div>
</section>

<script>
    function updateTimer() {
        const launchDate = new Date("June 7, 2026 12:00:00").getTime();
        const now = new Date().getTime();
        const distance = launchDate - now;

        if (distance < 0) {
            document.getElementById("drop").innerHTML = "<h2 class='text-white font-serif text-4xl uppercase tracking-[0.5em]'>THE PORTAL IS OPEN</h2>";
            return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("days").innerText = days.toString().padStart(2, '0');
        document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
        document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
        document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
    }

    // Timer jede Sekunde aktualisieren
    setInterval(updateTimer, 1000);
    updateTimer(); // Initialer Aufruf
</script>
