<!DOCTYPE html>
<html lang="de" class="h-full scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEARELUMINA | BORN AGAIN</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #000000;
      color: #ffffff;
    }
    /* Subtiler Film-Grain für den Lofi-Vibe */
    .film-grain {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.04;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body class="h-full font-sans antialiased flex flex-col justify-between selection:bg-white selection:text-black">

  <div class="film-grain"></div>

  <div class="w-full bg-black border-b border-zinc-900 py-2 px-4 text-center z-50">
    <p class="text-[9px] md:text-xs font-bold tracking-[0.3em] text-zinc-400 uppercase">
      IHR SEID DAS LICHT DER WELT — MATTHÄUS 5:14
    </p>
  </div>

  <header class="w-full bg-black border-b border-zinc-900 sticky top-0 z-50 px-6 py-4 md:px-12">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      
      <nav class="hidden md:flex items-center gap-8 text-[11px] font-bold tracking-widest text-zinc-400 uppercase">
        <a href="#" class="hover:text-white transition-colors">Shop</a>
        <a href="#" class="hover:text-white transition-colors">Members Club</a>
      </nav>

      <div class="text-center flex-1 md:flex-none">
        <a href="#" class="text-lg md:text-xl font-black tracking-[0.3em] text-white uppercase">
          WEARELUMINA
        </a>
      </div>

      <div class="flex items-center gap-6 text-zinc-400">
        <button class="hover:text-white transition-colors" title="Suche">
          <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </button>
        <button class="hover:text-white transition-colors" title="Konto">
          <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
        </button>
        <button class="hover:text-white transition-colors relative" title="Warenkorb">
          <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
          </svg>
          <span class="absolute -top-1 -right-1.5 bg-white text-black font-bold text-[8px] w-3.5 h-3.5 rounded-full flex items-center justify-center">0</span>
        </button>
      </div>

    </div>
  </header>

  <main class="flex-grow flex flex-col md:flex-row min-h-[calc(100vh-105px)]">
    
    <div class="relative flex-1 flex flex-col justify-end p-8 md:p-16 bg-zinc-950 group overflow-hidden min-h-[50vh] md:min-h-0 border-b md:border-b-0 md:border-r border-zinc-900">
      <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?q=80&w=1000&auto=format&fit=crop" 
           alt="Born Again Teaser" 
           class="absolute inset-0 w-full h-full object-cover opacity-30 group-hover:opacity-50 group-hover:scale-105 transition-all duration-1000 filter grayscale">
      
      <div class="relative z-10 space-y-4">
        <span class="text-[9px] font-bold tracking-[0.4em] text-zinc-500 uppercase block">Drop 01 — Archive</span>
        <h2 class="text-4xl md:text-7xl font-900 tracking-tighter uppercase leading-none">
          BORN AGAIN<br><span class="text-xl md:text-2xl font-light tracking-[0.2em] text-zinc-400">HEAVYWEIGHT TEE</span>
        </h2>
        <div class="pt-2">
          <span class="inline-block border-b border-white pb-1 text-xs font-bold tracking-widest uppercase text-zinc-300 group-hover:text-white group-hover:border-white transition-all">
            Coming Soon
          </span>
        </div>
      </div>
    </div>

    <div class="relative flex-1 flex flex-col justify-end p-8 md:p-16 bg-black overflow-hidden min-h-[50vh] md:min-h-0">
      <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-zinc-900 via-black to-black opacity-70 z-0"></div>
      
      <div class="relative z-10 space-y-8 md:text-right w-full">
        
        <div class="space-y-2">
          <span class="text-[9px] font-bold tracking-[0.4em] text-zinc-500 uppercase block">Time Remaining</span>
          <div id="countdown" class="text-4xl md:text-6xl font-900 tracking-tight text-white font-mono uppercase">
            00D : 00H : 00M : 00S
          </div>
        </div>

        <div class="space-y-4">
          <h2 class="text-3xl md:text-5xl font-900 tracking-tighter uppercase leading-none">
            THE PORTAL<br>OPENS
          </h2>
          <p class="text-xs text-zinc-500 tracking-widest uppercase">
            07. Juni 2026 — 12:00 CET
          </p>
        </div>

      </div>
    </div>

  </main>

  <footer class="w-full bg-black border-t border-zinc-900 py-6 px-6 text-center text-[10px] tracking-widest text-zinc-600 uppercase">
    <div class="flex justify-center gap-6 mb-2">
      <a href="#" class="hover:text-white transition-colors">Instagram</a>
      <a href="#" class="hover:text-white transition-colors">TikTok</a>
      <a href="#" class="hover:text-white transition-colors">Imprint</a>
    </div>
    <p>© 2026 WEARELUMINA. ALL RIGHTS RESERVED.</p>
  </footer>

  <script>
    // Ziel-Datum: 07. Juni 2026 um 12:00:00 Uhr
    const targetDate = new Date("June 7, 2026 12:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference < 0) {
        document.getElementById("countdown").innerText = "PORTAL OPEN";
        return;
      }

      // Berechnung von Tagen, Stunden, Minuten und Sekunden
      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      // Formatierung (immer zweistellig)
      const dStr = days.toString().padStart(2, '0');
      const hStr = hours.toString().padStart(2, '0');
      const mStr = minutes.toString().padStart(2, '0');
      const sStr = seconds.toString().padStart(2, '0');

      // Anzeige im Element aktualisieren
      document.getElementById("countdown").innerText = `${dStr}D : ${hStr}H : ${mStr}M : ${sStr}S`;
    }

    // Timer alle 1 Sekunde aktualisieren
    setInterval(updateCountdown, 1000);
    updateCountdown(); // Direkt beim Laden ausführen
  </script>

</body>
</html>
