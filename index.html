<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEARELUMINA - Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: #000000; 
            color: #ffffff; 
            overflow-x: hidden; 
            position: relative;
        }

        /* --- Hintergrund-Layout wie in deiner Skizze --- */
        #bubble-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0; 
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            background-image: url('image_a3b6e0.jpg');
            background-repeat: no-repeat;
            mix-blend-mode: screen; 
            image-rendering: pixelated; 
            opacity: 0.25; /* Subtil, wie von dir gewünscht */
            border-radius: 50%;
            /* Sanftes Atmen statt wildem Fliegen */
            animation: breathe 12s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* --- Navbar & Content (Z-Index 10, damit alles vorne bleibt) --- */
        .navbar, .view-section { position: relative; z-index: 10; }

        /* ... (Der restliche CSS-Code bleibt identisch wie gehabt) ... */
        
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 3rem; background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); position: fixed; width: 100%; top: 0; }
        .nav-left { display: flex; align-items: center; gap: 3rem; }
        .anime-logo { transform: skewX(-12deg); font-family: 'Arial Black', sans-serif; cursor: pointer; display: flex; flex-direction: column; }
        .anime-logo .ti { font-size: 1.1rem; font-weight: 900; color: #ffffff; }
        .anime-logo .en { font-size: 0.9rem; letter-spacing: 4px; color: #ffffff; }
        .nav-links { display: flex; list-style: none; gap: 2rem; }
        .nav-links a { text-decoration: none; color: #888888; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; cursor: pointer; }
        .nav-links a:hover { color: #ffffff; }
        .icons { font-size: 1.2rem; display: flex; gap: 1.5rem; color: #ffffff; }

        .view-section { display: none; padding-top: 150px; }
        .view-section.active { display: block; }

        .hero { text-align: center; margin-bottom: 4rem; }
        .hero h1 { font-size: 4rem; font-weight: 800; letter-spacing: -2px; }
        .hero p { color: #888888; margin: 1rem 0; text-transform: uppercase; }
        .hero-btn { padding: 1rem 3rem; border: 1px solid #ffffff; color: white; text-decoration: none; border-radius: 40px; }

        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3rem; max-width: 900px; margin: 0 auto; }
        .product-card { background: rgba(20,20,20,0.6); padding: 2rem; border: 1px solid #333; border-radius: 20px; }
    </style>
</head>
<body>

    <div id="bubble-container"></div>

    <nav class="navbar">
        <div class="nav-left">
            <div class="anime-logo">
                <span class="ti">ንሕና ብርሃን ኢና።</span>
                <span class="en">WEARELUMINA</span>
            </div>
            <ul class="nav-links">
                <li><a class="active">New Arrivals</a></li>
                <li><a>Collections</a></li>
                <li><a>Our Story</a></li>
            </ul>
        </div>
        <div class="icons"><span>🔍</span> <span>👤</span> <span>🛒</span></div>
    </nav>

    <div id="view-neuheiten" class="view-section active">
        <header class="hero">
            <h1>WE ARE LUMINA</h1>
            <p>Matthew 5:14 You are the light of the world.</p>
            <a href="#" class="hero-btn">SHOP THE DROP</a>
        </header>
        <section class="product-grid">
            <div class="product-card">P1</div>
            <div class="product-card">P2</div>
        </section>
    </div>

    <script>
        const bubbleContainer = document.getElementById('bubble-container');
        // Gezielte Platzierung basierend auf deiner Skizze
        const positions = [
            { top: '10%', left: '5%' }, { top: '5%', left: '90%' },
            { top: '40%', left: '2%' }, { top: '80%', left: '5%' },
            { top: '60%', left: '92%' }, { top: '85%', left: '85%' },
            { top: '30%', left: '95%' }
        ];

        positions.forEach(pos => {
            let bubble = document.createElement('div');
            bubble.classList.add('bubble');
            bubble.style.top = pos.top;
            bubble.style.left = pos.left;
            bubble.style.width = '100px'; 
            bubble.style.height = '100px';
            bubble.style.backgroundSize = '500% 500%';
            bubble.style.backgroundPosition = 'center';
            bubbleContainer.appendChild(bubble);
        });
    </script>
</body>
</html>
