<!DOCTYPE html>
<html lang="de">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: #2b317c; 
            color: #ffffff;
            overflow-x: hidden;
            /* Hier wird dein schwebendes Element als Hintergrund eingebunden */
            background-image: url('DEIN_SCHWEBENDES_ELEMENT.png');
            background-repeat: no-repeat;
            background-position: center 20%;
            background-size: 30%; /* Passe die Größe hier an */
        }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.2rem 3rem; background-color: #1a1e52; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            position: relative; z-index: 100;
        }

        .nav-left { display: flex; align-items: center; gap: 3rem; }
        .anime-logo { color: #e52b20; transform: skewX(-12deg); font-family: 'Arial Black', sans-serif; cursor: pointer; }
        .anime-logo .ja { font-size: 1.8rem; font-weight: 900; }
        .anime-logo .en { font-size: 0.9rem; letter-spacing: 4px; color: #ffffff; }

        .nav-links { display: flex; list-style: none; gap: 2rem; }
        .nav-links a { text-decoration: none; color: #aeb2d8; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }
        .icons { font-size: 1.2rem; display: flex; gap: 1.5rem; color: #aeb2d8; }

        .hero {
            height: 60vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
        }

        .hero h1 { font-size: 4rem; font-weight: 300; margin-bottom: 1rem; }
        .hero p { font-size: 1rem; color: #aeb2d8; margin-bottom: 2.5rem; text-transform: uppercase; }
        .hero-btn {
            padding: 1rem 3rem; background: #ffffff; color: #1a1e52;
            text-decoration: none; border-radius: 40px; font-weight: 700;
        }

        .products-section { padding: 2rem 3rem 6rem 3rem; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4rem; max-width: 900px; margin: 0 auto; }
        .product-card { display: flex; flex-direction: column; align-items: center; }
        
        .badge {
            background-color: #ffffff; color: #1a1e52; padding: 0.4rem 1.2rem;
            border-radius: 20px; font-size: 0.75rem; font-weight: 700; margin-bottom: 1rem;
        }

        .product-image {
            width: 100%; height: 400px; background-size: contain;
            background-position: center; background-repeat: no-repeat;
        }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .product-grid { grid-template-columns: 1fr; }
            body { background-size: 60%; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <div class="anime-logo">
                <span class="ja">ウィーアールミナ</span>
                <span class="en">WEARELUMINA</span>
            </div>
            <ul class="nav-links">
                <li><a href="#">Neuheiten</a></li>
                <li><a href="#">Kollektionen</a></li>
                <li><a href="#">Unsere Story</a></li>
            </ul>
        </div>
        <div class="icons">
            <span>🔍</span> <span>👤</span> <span>🛒</span>
        </div>
    </nav>
<header class="hero" style="height: 40vh; justify-content: flex-start; padding-top: 5rem;">
    <h1 style="font-size: 5rem; font-weight: 800; letter-spacing: -2px; margin-bottom: 0.5rem;">WEARELUMINA</h1>
    <p style="font-size: 1.2rem; color: #888; letter-spacing: 4px; text-transform: uppercase;">MATTHEW 5:14 YOU ARE THE LIGHT OF THE WORLD.</p>
</header>
    <section class="products-section">
        <div class="product-grid">
            <div class="product-card">
                <div class="badge">Ausverkauft</div>
                <div class="product-image" style="background-image: url('DEIN_SHIRT_1.png');"></div>
            </div>
            <div class="product-card">
                <div class="badge">Ausverkauft</div>
                <div class="product-image" style="background-image: url('DEIN_SHIRT_2.png');"></div>
            </div>
        </div>
    </section>

</body>
</html>
