<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeAreLumina - Streetwear</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- GRUNDEINSTELLUNGEN --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #333333;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* --- NAVIGATION --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
            background-color: #eef2f6;
            color: #111;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        .nav-links a {
            text-decoration: none;
            color: #444;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #000;
        }

        .icons {
            font-size: 1.2rem;
            display: flex;
            gap: 1.2rem;
            cursor: pointer;
            color: #111;
        }

        /* --- HERO BEREICH --- */
        .hero {
            height: 60vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #222; /* Dunkler Start-Hintergrund */
            background-size: cover;
            background-position: center;
            text-align: center;
            position: relative;
            cursor: pointer; /* Zeigt an, dass man klicken kann */
            transition: background 0.3s ease;
        }

        .hero:hover .upload-hint {
            opacity: 1;
        }

        .hero h1 {
            font-size: 4.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            letter-spacing: -1px;
            color: #ffffff;
            z-index: 2;
        }

        .hero-btn {
            padding: 0.8rem 2.5rem;
            background: transparent;
            color: #ffffff;
            text-decoration: none;
            border: 1px solid #ffffff;
            border-radius: 30px;
            font-size: 1rem;
            transition: all 0.3s ease;
            z-index: 2;
            pointer-events: none; /* Verhindert, dass der Button den Klick blockiert */
        }

        .upload-hint {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        /* --- PRODUKTE BEREICH --- */
        .products-section {
            padding: 4rem 3rem;
            background-color: #333333;
        }

        .products-section h2 {
            font-size: 2rem;
            margin-bottom: 4rem;
            font-weight: 700;
            color: #ffffff;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .badge {
            background-color: #f4f4f4;
            color: #333;
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            position: absolute;
            top: -15px;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .shirt-placeholder {
            width: 100%;
            height: 300px;
            background-color: #222222; 
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #777;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.3s ease;
            text-align: center;
            padding: 1rem;
            border: 2px dashed #444;
        }

        .shirt-placeholder:hover {
            transform: scale(1.02);
            background-color: #2a2a2a;
            border-color: #666;
            color: #aaa;
        }

        .shirt-placeholder span {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 3rem 2rem; }
            .hero h1 { font-size: 3rem; }
        }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 1rem; padding: 1rem; }
            .nav-links { gap: 1rem; }
            .product-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <div class="logo">WeAreLumina</div>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Katalog</a></li>
                <li><a href="#">Kontakt</a></li>
                <li><a href="#">über uns</a></li>
            </ul>
        </div>
        <div class="icons">
            <span>🔍</span> 
            <span>👤</span> 
            <span>🛍️</span>
        </div>
    </nav>

    <header class="hero" id="hero-bg" onclick="document.getElementById('hero-upload').click()">
        <h1>WeAreLumina©</h1>
        <a href="#" class="hero-btn">Shop all</a>
        <div class="upload-hint">Klicke hier, um ein Hintergrundbild hochzuladen</div>
    </header>
    <input type="file" id="hero-upload" accept="image/*" style="display: none;" onchange="updateHero(event)">

    <section class="products-section">
        <h2>Produkte</h2>
        <div class="product-grid">
            
            <div class="product-card">
                <div class="badge">Ausverkauft</div>
                <div class="shirt-placeholder" onclick="document.getElementById('prod1').click()">
                    <span>+</span>
                    BORN AGAIN
                </div>
                <input type="file" id="prod1" accept="image/*" style="display: none;" onchange="updateProduct(event, this)">
            </div>

            <div class="product-card">
                <div class="badge">Ausverkauft</div>
                <div class="shirt-placeholder" onclick="document.getElementById('prod2').click()">
                    <span>+</span>
                    DEAD TO THE WORLD
                </div>
                <input type="file" id="prod2" accept="image/*" style="display: none;" onchange="updateProduct(event, this)">
            </div>

            <div class="product-card">
                <div class="badge">Ausverkauft</div>
                <div class="shirt-placeholder" onclick="document.getElementById('prod3').click()">
                    <span>+</span>
                    MADE BY CHRIST
                </div>
                <input type="file" id="prod3" accept="image/*" style="display: none;" onchange="updateProduct(event, this)">
            </div>

            <div class="product-card">
                <div class="badge">Ausverkauft</div>
                <div class="shirt-placeholder" onclick="document.getElementById('prod4').click()">
                    <span>+</span>
                    BURNED CROSS
                </div>
                <input type="file" id="prod4" accept="image/*" style="display: none;" onchange="updateProduct(event, this)">
            </div>

        </div>
    </section>

    <script>
        // Funktion für das große Hintergrundbild
        function updateHero(event) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                const hero = document.getElementById('hero-bg');
                // Legt einen leichten dunklen Filter über das Bild, damit die weiße Schrift lesbar bleibt
                hero.style.backgroundImage = `linear-gradient(to bottom, rgba(30,35,30,0.6), rgba(20,20,20,0.8)), url('${url}')`;
                hero.querySelector('.upload-hint').style.display = 'none';
            }
        }

        // Funktion für die T-Shirt Platzhalter
        function updateProduct(event, inputElement) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                const placeholder = inputElement.previousElementSibling;
                
                // Setzt das Bild als Hintergrund und entfernt den Rahmen/Text
                placeholder.style.backgroundImage = `url('${url}')`;
                placeholder.style.backgroundSize = 'contain'; // Verhindert, dass das Shirt abgeschnitten wird
                placeholder.style.backgroundPosition = 'center';
                placeholder.style.backgroundRepeat = 'no-repeat';
                placeholder.style.backgroundColor = 'transparent';
                placeholder.style.border = 'none';
                placeholder.innerHTML = ''; // Löscht den "+" Text
            }
        }
    </script>
</body>
</html>
