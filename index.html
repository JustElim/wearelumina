<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEARELUMINA - Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* --- Grundlegendes Setup --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: #000000; 
            color: #ffffff; 
            overflow-x: hidden; 
            position: relative;
        }

        /* --- Dynamischer & Verpixelter Seifenblasen-Hintergrund --- */
        #bubble-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0; 
            overflow: hidden;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            background-image: url('image_a3b6e0.jpg'); 
            background-repeat: no-repeat;
            mix-blend-mode: screen; 
            image-rendering: pixelated; 
            opacity: 0.35; 
            border-radius: 50%;
            animation: breathe 12s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* --- Navbar --- */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.2rem 3rem; 
            background-color: rgba(0, 0, 0, 0.7); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: fixed; width: 100%; top: 0; 
            z-index: 1000;
        }
        .nav-left { display: flex; align-items: center; gap: 3rem; }
        
        .anime-logo { 
            transform: skewX(-12deg); 
            font-family: 'Arial Black', sans-serif; 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
        }
        .anime-logo .ti { font-size: 1.1rem; font-weight: 900; letter-spacing: 1px; margin-bottom: 2px; color: #ffffff; }
        .anime-logo .en { font-size: 0.9rem; letter-spacing: 4px; color: #ffffff; }

        .nav-links { display: flex; list-style: none; gap: 2rem; }
        .nav-links a { text-decoration: none; color: #888888; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; }
        .nav-links a:hover, .nav-links a.active { color: #ffffff; }
        
        .icons { font-size: 1.2rem; display: flex; gap: 1.5rem; color: #ffffff; cursor: pointer; }

        /* --- Views --- */
        .view-section { display: none; padding-top: 150px; padding-bottom: 4rem; position: relative; z-index: 10; }
        .view-section.active { display: block; }

        /* --- Ansicht 1: Neuheiten --- */
        .hero { text-align: center; margin-bottom: 4rem; }
        .hero h1 { font-size: 4rem; font-weight: 800; letter-spacing: -2px; }
        .hero p { color: #888888; margin: 1rem 0; text-transform: uppercase; letter-spacing: 2px; }
        .hero-btn { padding: 1rem 3rem; border: 1px solid #ffffff; color: white; text-decoration: none; border-radius: 40px; font-weight: 700; transition: 0.3s; }
        .hero-btn:hover { background: #ffffff; color: #000000; }

        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3rem; max-width: 900px; margin: 0 auto; }
        .product-card { background: rgba(20,20,20,0.6); padding: 2rem; border: 1px solid #333; border-radius: 20px; position: relative; }
        .product-id { position: absolute; top: 1rem; left: 1.5rem; color: #555; font-weight: bold; }
        .badge { background: #fff; color: #000; padding: 0.3rem 1rem; border-radius: 20px; font-size: 0.7rem; float: right; font-weight: 800; }
        .product-image { width: 100%; height: 300px; background-size: contain; background-repeat: no-repeat; background-position: center; margin-top: 2rem; }

        /* --- Story & Vision --- */
        .story-wrapper { max-width: 800px; margin: 0 auto; padding: 2rem; background: rgba(20,20,20,0.6); border-radius: 20px; }
        .story-section h2 { font-size: 3rem; margin-bottom: 2rem; border-bottom: 2px solid #fff; display: inline-block; }
        .story-section p { margin-bottom: 1.5rem; line-height: 1.6; color: #ccc; }
    </style>
</head>
<body>

    <div id="bubble-container"></div>

    <nav class="navbar">
        <div class="nav-left">
            <div class="anime-logo" id="logo-btn">
                <span class="ti">ንሕና ብርሃን ኢና።</span>
                <span class="en">WEARELUMINA</span>
            </div>
            <ul class="nav-links">
                <li><a id="nav-neuheiten" class="active">New Arrivals</a></li>
                <li><a id="nav-kollektionen">Collections</a></li>
                <li><a id="nav-story">Our Story</a></li>
            </ul>
        </div>
        <div class="icons"><span>🔍</span> <span>👤</span> <span>🛒</span></div>
    </nav>

    <div id="view-neuheiten" class="view-section active">
        <header class="hero">
            <h1>WE ARE LUMINA</h1>
            <p>You are the light of the world. A town built on a hill cannot be hidden.</p>
            <a href="#" class="hero-btn">SHOP THE DROP</a>
        </header>
        <section class="product-grid">
            <div class="product-card"><span class="product-id">P1</span><div class="badge">Sold Out</div><div class="product-image"></div></div>
            <div class="product-card"><span class="product-id">P2</span><div class="badge">Sold Out</div><div class="product-image"></div></div>
        </section>
    </div>

    <div id="view-kollektionen" class="view-section">
        <div class="story-wrapper"><h2>Collections</h2><p>Coming soon...</p></div>
    </div>
