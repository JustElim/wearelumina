<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEARELUMINA - Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* [Dein bisheriges CSS bleibt identisch, hier nur eingefügt für Vollständigkeit] */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #000000; color: #ffffff; overflow-x: hidden; }
        #bubble-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; overflow: hidden; pointer-events: none; }
        .bubble { position: absolute; background-image: url('-24.jpg'); background-repeat: no-repeat; mix-blend-mode: screen; image-rendering: pixelated; opacity: 0.35; border-radius: 50%; }
        @keyframes float { 0% { transform: translateY(10vh) scale(1) rotate(0deg); opacity: 0; } 20% { opacity: 0.35; } 80% { opacity: 0.35; } 100% { transform: translateY(-110vh) scale(1.1) rotate(15deg); opacity: 0; } }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 3rem; background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); position: fixed; width: 100%; top: 0; z-index: 1000; }
        .anime-logo { transform: skewX(-12deg); font-family: 'Arial Black', sans-serif; cursor: pointer; display: flex; flex-direction: column; }
        .nav-links { display: flex; list-style: none; gap: 2rem; }
        .nav-links a { text-decoration: none; color: #aeb2d8; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; }
        .nav-links a:hover, .nav-links a.active { color: #ffffff; }
        .view-section { display: none; padding-top: 150px; padding-bottom: 4rem; position: relative; z-index: 10; }
        .view-section.active { display: block; }
    </style>
</head>
<body>

    <div id="bubble-container"></div>

    <nav class="navbar">
        <div class="nav-left">
            <div class="anime-logo" id="logo-btn">
                <span class="ti">ንሕና ብርሃን ኢና።</span>
                <span class="en">WEARELUMINA</span>
            </div>
            <ul class="nav-links">
                <li><a id="nav-neuheiten" class="active">New Arrivals</a></li>
                <li><a id="nav-kollektionen">Collections</a></li>
                <li><a id="nav-story">Our Story</a></li>
            </ul>
        </div>
        <div class="icons"><span>🔍</span> <span>👤</span> <span>🛒</span></div>
    </nav>

    <div id="view-neuheiten" class="view-section active">...</div>
    <div id="view-kollektionen" class="view-section">...</div>
    <div id="view-story" class="view-section">...</div>

    <script>
        // 1. Blasen-Generierung
        const bubbleContainer = document.getElementById('bubble-container');
        for (let i = 0; i < 12; i++) {
            let bubble = document.createElement('div');
            bubble.classList.add('bubble');
            bubble.style.width = (Math.random() * 80 + 70) + 'px';
            bubble.style.height = bubble.style.width;
            bubble.style.left = Math.random() * 90 + 'vw';
            bubble.style.animation = `float ${Math.random() * 30 + 30}s infinite linear`;
            bubbleContainer.appendChild(bubble);
        }

        // 2. NAVIGATION LOGIC (Hier lag der Fehler, das fehlte!)
        const navNeuheiten = document.getElementById('nav-neuheiten');
        const navKollektionen = document.getElementById('nav-kollektionen');
        const navStory = document.getElementById('nav-story');

        const viewNeuheiten = document.getElementById('view-neuheiten');
        const viewKollektionen = document.getElementById('view-kollektionen');
        const viewStory = document.getElementById('view-story');

        function showView(view) {
            // Alle ausblenden
            [viewNeuheiten, viewKollektionen, viewStory].forEach(v => v.classList.remove('active'));
            [navNeuheiten, navKollektionen, navStory].forEach(n => n.classList.remove('active'));
            
            // Die gewählte einblenden
            view.classList.add('active');
        }

        navNeuheiten.addEventListener('click', () => showView(viewNeuheiten));
        navKollektionen.addEventListener('click', () => showView(viewKollektionen));
        navStory.addEventListener('click', () => showView(viewStory));
    </script>
</body>
</html>
