<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEARELUMINA - Kollektionsübersicht</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Inter', sans-serif; 
        }

        body {
            background-color: #2b317c; 
            color: #ffffff;
            overflow-x: hidden;
            /* Hintergrundbild aus dem Original */
            background-image: url('https://placehold.co/400x400/2b317c/ffffff?text=SCHWEBEND');
            background-repeat: no-repeat;
            background-position: center 20%;
            background-size: 30%; 
        }

        /* --- Navbar (Original-Stil) --- */
        .navbar {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 1.2rem 3rem; 
            background-color: #1a1e52; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            position: fixed; /* Fixierte Nav, damit sie sichtbar bleibt */
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .nav-left { 
            display: flex; 
            align-items: center; 
            gap: 3rem; 
        }

        .anime-logo { 
            color: #e52b20; 
            transform: skewX(-12deg); 
            font-family: 'Arial Black', sans-serif; 
            cursor: pointer; 
        }

        .anime-logo .ja { 
            font-size: 1.8rem; 
            font-weight: 900; 
        }

        .anime-logo .en { 
            font-size: 0.9rem; 
            letter-spacing: 4px; 
            color: #ffffff; 
        }

        .nav-links { 
            display: flex; 
            list-style: none; 
            gap: 2rem; 
        }

        .nav-links a { 
            text-decoration: none; 
            color: #aeb2d8; 
            font-size: 0.85rem; 
            font-weight: 600; 
            text-transform: uppercase; 
        }

        .icons { 
            font-size: 1.2rem; 
            display: flex; 
            gap: 1.5rem; 
            color: #aeb2d8; 
        }

        /* --- Hero Section (Original-Stil) --- */
        .hero {
            height: 60vh; 
            margin-top: 80px; /* Platz für die fixierte Nav */
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            text-align: center;
            padding-top: 2rem;
        }

        .hero h1 { 
            font-size: 4rem; 
            font-weight: 800; /* Dickerer Font-Weight */
            margin-bottom: 0.5rem; 
            letter-spacing: -2px;
        }

        .hero p { 
            font-size: 1.2rem; /* Größerer Font-Size */
            color: #888; /* Dunklerer Grauton */
            margin-bottom: 2.5rem; 
            text-transform: uppercase; 
            letter-spacing: 4px;
        }

        .hero-btn {
            padding: 1rem 3rem; 
            background: #ffffff; 
            color: #1a1e52;
            text-decoration: none; 
            border-radius: 40px; 
            font-weight: 700;
        }

        /* --- Produkt Galerie (AKTUALISIERT für 2x2 Grid) --- */
        .products-section { 
            padding: 2rem 3rem 6rem 3rem; 
        }

        .product-grid { 
            display: grid; 
            /* Neue 2x2 Struktur */
            grid-template-columns: repeat(2, 1fr); 
            grid-template-rows: repeat(2, auto);
            gap: 3rem; /* Etwas kleinerer Gap als im Original */
            max-width: 1000px; /* Etwas breiter für 4 Produkte */
            margin: 0 auto; 
        }

        .product-card { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background-color: rgba(26, 30, 82, 0.5); /* Dunklerer Hintergrund für Karten */
            padding: 2rem;
            border-radius: 20px;
            position: relative; /* Wichtig für absolute Positionierung der ID */
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Produkt ID (P1, P2, P3, P4) - Neu hinzugefügt aus Skizze */
        .product-id {
            position: absolute;
            top: 1rem;
            left: 1.5rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: #aeb2d8;
            opacity: 0.7;
        }

        .badge {
            background-color: #ffffff; 
            color: #1a1e52; 
            padding: 0.4rem 1.2rem;
            border-radius: 20px; 
            font-size: 0.75rem; 
            font-weight: 700; 
            margin-bottom: 1rem;
            align-self: flex-end; /* Badge rechtsbündig */
        }

        .product-image {
            width: 100%; 
            height: 350px; /* Etwas kleiner für das 2x2 Grid */
            background-size: contain;
            background-position: center; 
            background-repeat: no-repeat;
        }

        /* Responsive Design (Original um 1 Spalte beibehalten) */
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .product-grid { grid-template-columns: 1fr; } /* Bricht auf mobilen Geräten um */
            body { background-size: 60%; }
            .hero h1 { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <div class="anime-logo">
                <span class="ja">ウィーアールミナ</span>
                <span class="en">WEARELUMINA</span>
            </div>
            <ul class="nav-links">
                <li><a href="#">Neuheiten</a></li>
                <li><a href="#">Kollektionen</a></li>
                <li><a href="#">Unsere Story</a></li>
            </ul>
        </div>
        <div class="icons">
            <span>🔍</span> <span>👤</span> <span>🛒</span>
        </div>
    </nav>

    <header class="hero">
        <h1>WE ARE<br>LUMINA.</h1>
        <p>Matthew 5:14 You are the light of the world.</p>
        <a href="#" class="hero-btn">SHOP THE DROP</a>
    </header>

    <section class="products-section">
        <div class="product-grid">
            <div class="product-card">
                <span class="product-id">P1</span>
                <div class="badge">Ausverkauft</div>
                <div class="product-image" style="background-image: url('https://placehold.co/400x400/2b317c/ffffff?text=TSHIRT+1');"></div>
            </div>
            <div class="product-card">
                <span class="product-id">P2</span>
                <div class="badge">Ausverkauft</div>
                <div class="product-image" style="background-image: url('https://placehold.co/400x400/2b317c/ffffff?text=TSHIRT+2');"></div>
            </div>
            <div class="product-card">
                <span class="product-id">P3</span>
                <div class="badge">Neuheiten</div>
                <div class="product-image" style="background-image: url('https://placehold.co/400x400/2b317c/ffffff?text=PULLOVER+1');"></div>
            </div>
            <div class="product-card">
                <span class="product-id">P4</span>
                <div class="badge">Letzte Chance</div>
                <div class="product-image" style="background-image: url('https://placehold.co/400x400/2b317c/ffffff?text=TSHIRT+3');"></div>
            </div>
        </div>
    </section>

</body>
</html>
